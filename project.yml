# HomeHub — XcodeGen project specification
#
# Generate the Xcode project:
#   brew install xcodegen   (if needed)
#   xcodegen generate
#
# Then open HomeHub.xcodeproj in Xcode.
#
# ── Runtime backends ──────────────────────────────────────────────────────────
# The primary on-device LLM backend is MLX (mlx-swift / mlx-swift-lm). It has
# no native dependency outside of Swift packages, so default builds compile
# cleanly on a fresh checkout.
#
# llama.cpp is OPTIONAL and OFF by default. To re-enable it:
#   1. Place llama.xcframework as a sibling of the repo root, e.g.:
#        ~/Developer/
#          llama.xcframework/   ← here
#          ios-home-hub/        ← repo root
#   2. Uncomment the lines tagged "[llama.cpp opt-in]" below (the
#      framework dep, framework/header search paths, and the compile flag in
#      both SWIFT_ACTIVE_COMPILATION_CONDITIONS and GCC_PREPROCESSOR_DEFINITIONS).
#   3. Re-run `xcodegen generate`.
# ─────────────────────────────────────────────────────────────────────────────

name: HomeHub

options:
  bundleIdPrefix: cz.keksiczek
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true
  generateEmptyDirectories: false

# Explicit shared schemes (committed under
# HomeHub.xcodeproj/xcshareddata/xcschemes/). Without these, a fresh clone has
# no scheme — `xcodebuild -scheme HomeHub` fails until someone opens the
# project in Xcode and lets it autocreate one, which then ends up in
# xcuserdata (per-developer, not committed).
schemes:
  HomeHub:
    build:
      targets:
        HomeHub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HomeHubTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  HomeHubWidget:
    build:
      targets:
        HomeHubWidget: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  # mlx-swift uses semver; `from: 0.21.0` pins to the latest 0.x compatible
  # release. The committed Package.resolved locks the exact revision so builds
  # are fully reproducible.
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.21.0
  # mlx-swift-lm has no stable tag series yet, so we pin to a specific
  # revision rather than `branch: main`.  branch: main means "whatever main
  # was when xcodebuild last resolved", which silently changes when someone
  # nukes their SourcePackages cache. Pinning the SHA here keeps project.yml,
  # Package.swift and Package.resolved literally identical — `make ci`
  # cross-checks them and fails fast on drift.
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: 7e2b7107be52ffbfe488f3c7987d3f52c1858b4b
  # Explicit direct dependency on swift-transformers so the version is
  # pinned rather than resolved transitively through mlx-swift-lm.
  # from: 0.1.14 is the minimum compatible with WhisperKit 0.11.0.
  #
  # NOTE: swift-transformers exports ONE library product: "Transformers"
  # (targets: ["Tokenizers", "Generation", "Models"]).  "Hub" and "Tokenizers"
  # are internal targets — they must NOT be referenced as product names.
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 0.1.14
  # WhisperKit >= 0.11.0 is required. 0.9.x and earlier import TensorUtils
  # as a standalone module from swift-transformers; that module was removed
  # when swift-transformers was restructured into Hub/Tokenizers products.
  # Using 0.9.x with swift-transformers >= 0.1.14 therefore produces
  # "Unable to find module dependency: 'TensorUtils'" at build time.
  # VoiceService.swift gates all WhisperKit usage behind
  # #if canImport(WhisperKit) so the app still compiles if this package is
  # removed; keeping it here enables the on-device STT path.
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.11.0
  # Stable Diffusion via Apple's Core ML pipeline.
  #
  # We depend on a fork (Keksiczek/ml-stable-diffusion) rather than
  # apple/ml-stable-diffusion because Apple's upstream pins
  # swift-transformers to `.exact("0.1.8")` while HomeHub already needs
  # >= 0.1.14 transitively (via mlx-swift-lm + WhisperKit 0.11.0).
  # The fork loosens that one line to a range
  # `"0.1.8"..<"0.2.0"` so SPM's intersection with our own `from: 0.1.14`
  # is non-empty. Everything else in the fork is byte-identical to
  # upstream; periodically rebase against apple/main to pick up fixes.
  StableDiffusion:
    url: https://github.com/Keksiczek/ml-stable-diffusion
    branch: main

settings:
  base:
    # Apple Developer Program team (paid, Individual). Declared here rather
    # than left to per-developer Xcode state because:
    #
    #   * Picking a team in Xcode → Signing & Capabilities writes
    #     DEVELOPMENT_TEAM into project.pbxproj, NOT into xcuserdata. Since
    #     the pbxproj is regenerated from this file, every `xcodegen generate`
    #     silently wiped the selection and the next device build failed to
    #     sign. (The previous comment here asserted the opposite; it was
    #     wrong, which is why device builds kept losing their team.)
    #   * The kernel entitlements below are only granted by Apple's signing
    #     server when the build is signed by a team entitled to them. A build
    #     with no team produces an unentitled binary that still *believes* it
    #     is entitled — precisely the state that jetsams on a large model.
    #
    # We deliberately do NOT go back to the LocalOverride.xcconfig route:
    # xcodegen emits non-deterministic `TEMP_<uuid>` PBXFileReferences for
    # configFiles outside the source tree, which made the pbxproj drift on
    # every regeneration and broke the CI drift guard.
    #
    # Forking this project? Replace the value with your own team ID, or
    # override on the command line: `xcodebuild … DEVELOPMENT_TEAM=YOURID`.
    DEVELOPMENT_TEAM: 8Y755TXDN8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES

    # IPHONEOS_DEPLOYMENT_TARGET is owned by `options.deploymentTarget.iOS`
    # at the top of this file. Setting it again here would shadow the
    # project-level value and silently drift.
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HomeHub:
    type: application
    platform: iOS
    entitlements:
      path: HomeHub/HomeHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cz.keksiczek.homehub.shared
        # iCloud Documents sync — backs AppSettings.iCloudSyncEnabled.
        # Container must be provisioned on the team's App ID; on free
        # Apple-ID teams the runtime falls back to local Application
        # Support silently.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.cz.keksiczek.homehub
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.cz.keksiczek.homehub
        # ── Kernel memory entitlements ────────────────────────────────────
        # Both require a paid Apple Developer Program membership and are
        # granted by Apple's signing server at signing time. They are
        # permitted for App Store distribution, so every user of a
        # store build gets them — not just local development installs.
        #
        # increased-memory-limit
        #   Raises the per-process jetsam threshold. On an 8 GB device the
        #   app goes from roughly a 3 GB working set to ~5 GB before iOS
        #   starts killing it. This is what makes a 4-bit 7B model or
        #   Gemma 3n E4B viable at all.
        #
        # extended-virtual-addressing
        #   Lifts the ~2 GB ceiling on a single contiguous mmap. MLX-Swift
        #   maps each *.safetensors shard as one region, so without this a
        #   model shipping its weights as one 4.5 GB file cannot load no
        #   matter how much RAM the device has.
        #
        # These are declared unconditionally. Safety does NOT come from
        # omitting them — it comes from DeviceMemoryProvider verifying at
        # runtime (SecTaskCopyValueForEntitlement) that the signature
        # actually carries them, and falling back to the conservative tier
        # when it does not. A build signed by a team without these
        # capabilities still runs correctly, just with smaller budgets.
        # See docs/production-readiness/03-ENTITLEMENTS.md.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    sources:
      - path: HomeHub
        # `*.md` documentation files are sprinkled across feature
        # folders (e.g. KnowledgeBase/README.md). xcodegen treats
        # non-Swift files as resources by default; left unexcluded
        # they collide on bundle copy with SharedKit/README.md
        # ("Multiple commands produce …/HomeHub.app/README.md").
        excludes:
          - "**/*.md"
      # SharedKit is the small set of files the Share Extension and
      # the host app both compile (SharedStorage, SharePayload, the
      # shared logger). Each target compiles its own copy — the only
      # cross-target contract is the JSON-on-disk file format.
      - path: SharedKit
        excludes:
          - "**/*.md"
    dependencies:
      # ── [llama.cpp opt-in] Binary framework + system frameworks ──────────────
      # Uncomment the next eight lines to re-enable llama.cpp. The framework is
      # not committed; place it as a sibling of the repo root before building.
      # See the file header for the full opt-in checklist.
      #
      # - framework: ../llama.xcframework
      #   embed: true
      #   codeSign: true
      # - sdk: Accelerate.framework
      # - sdk: Metal.framework
      # - sdk: MetalKit.framework
      # - sdk: MetalPerformanceShaders.framework
      # - sdk: CoreAudio.framework
      #
      # ── Swift Package dependencies ────────────────────────────────────────────
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      # MLXVLM is imported by MLXRuntime.swift purely for its side
      # effect: the framework's VLM model registry must be force-linked
      # so subsequent MLX inference can locate the V-L head when a
      # vision-language model is loaded. See MLXRuntime.swift:6-15.
      - package: MLXLM
        product: MLXVLM
      # Transformers is the only exported library product in swift-transformers.
      # Hub and Tokenizers are internal targets of it (not standalone products).
      - package: SwiftTransformers
        product: Transformers
      # WhisperKit for VoiceService.swift on-device STT.
      - package: WhisperKit
        product: WhisperKit
      # Core ML Stable Diffusion via Apple's pipeline.
      # `CoreMLStableDiffusionRuntime.swift` is gated behind
      # `#if canImport(StableDiffusion)` so removing this dependency
      # falls back to the deterministic stub renderer without breaking
      # the chat plumbing.
      - package: StableDiffusion
        product: StableDiffusion
      # Share Extension target — must be a dependency (with implicit
      # embed) so Xcode copies the .appex into the host app's
      # PlugIns folder at build time. Without this, the extension
      # builds but iOS never registers it with the share sheet.
      - target: HomeHubShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.keksiczek.homehub
        # ── [llama.cpp opt-in] Search paths and link flags ─────────────────────
        # Uncomment when re-enabling llama.cpp. Without this, the bridging
        # header skips <llama.h> and the Swift sources skip the llama_* call
        # sites, so default builds need none of these.
        #
        # FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.."
        # HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../llama.xcframework/ios-arm64/Headers"
        # OTHER_LDFLAGS: "$(inherited) -lc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # ── Privacy usage descriptions ────────────────────────────────────
        # The INFOPLIST_KEY_ prefix is MANDATORY. This target builds its
        # Info.plist via GENERATE_INFOPLIST_FILE=YES, and Xcode only injects
        # build settings whose name starts with INFOPLIST_KEY_. These seven
        # keys previously lacked the prefix, so they landed in the pbxproj
        # as inert build settings and never reached the bundle — meaning
        # every mic / speech / HomeKit / Calendar / Reminders request
        # terminated the app via TCC, and the build was un-shippable.
        # `scripts/check-infoplist-keys.sh` now asserts they are present in
        # the built app so this cannot regress silently.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mikrofon používáme jen pro hlasovou konverzaci s asistentem. Nahrávka se zpracuje přímo v zařízení a nikam se neodesílá."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Rozpoznávání řeči převádí tvůj hlas na text pro asistenta. Probíhá on-device, mimo zařízení nic neodchází."
        # Usage descriptions for the Skills registered by default in
        # SkillManager.init. Without these, iOS terminates the app the
        # moment HMHomeManager() is constructed or EKEventStore.requestAccess
        # is called — Apple enforces the keys at the OS level. Even users
        # who never invoke the skills must have the keys present, because
        # the prompt assembler may surface them to the model and the user
        # may trigger them via a tool call.
        INFOPLIST_KEY_NSHomeKitUsageDescription: "Přístup k HomeKitu potřebujeme, aby asistent mohl na tvůj pokyn ovládat chytrá zařízení v domácnosti."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Přístup ke kalendáři umožní asistentovi číst a vytvářet události, když ho o to požádáš."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Plný přístup ke kalendáři umožní asistentovi číst i zapisovat události, když ho o to požádáš."
        INFOPLIST_KEY_NSRemindersUsageDescription: "Přístup k připomínkám umožní asistentovi číst a vytvářet připomínky, když ho o to požádáš."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Plný přístup k připomínkám umožní asistentovi číst i zapisovat připomínky, když ho o to požádáš."
        # App uses only standard HTTPS/TLS for model downloads and no custom
        # cryptography — declare exemption so App Store review doesn't flag
        # the build as missing an export-compliance answer. If this changes
        # (e.g. adding non-exempt crypto), remove this key and answer the
        # encryption questionnaire in App Store Connect instead.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # ── Custom URL scheme — deferred ──────────────────────────────────
        # `homehub://…` deep links work *internally* (Spotlight tap →
        # `CSSearchableItemActivityIdentifier` → `DeepLink` → router)
        # without any URL scheme registration. Registering the scheme
        # via `CFBundleURLTypes` is only required for external launches
        # (Shortcuts.app, other apps) and would require either:
        #   1. A real Info.plist file (drops all the INFOPLIST_KEY_*
        #      auto-injection above), or
        #   2. xcodegen's `info.properties` block (same trade-off).
        # Wire up when we ship App Intents that emit URL output.
        # `INFOPLIST_KEY_CFBundleURLTypes` is NOT in Apple's auto-
        # mapping registry (it's an array-of-dicts, the auto-mapping
        # only handles strings + arrays-of-strings).
        # ──────────────────────────────────────────────────────────────────
        # BGTaskScheduler permitted identifiers. The host app registers a
        # `BGProcessingTask` for the document Knowledge Base ingest
        # pipeline (parsing → chunking → embedding → indexing of large
        # documents). Apple recommends `BGProcessingTask` for this kind
        # of long-running, deferrable ML/indexing work. Without this key
        # `BGTaskScheduler.register(forTaskWithIdentifier:)` aborts at
        # launch with `Error Domain=BGTaskSchedulerErrorDomain Code=1`.
        # The string MUST match `IngestScheduler.backgroundTaskIdentifier`.
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers: cz.keksiczek.homehub.ingest
        # The bridging header is intentionally kept even when llama.cpp is OFF:
        # it sits behind `#ifdef HOMEHUB_LLAMA_RUNTIME` so the C preprocessor
        # produces an empty translation unit by default. Removing the path
        # entirely would require a project regen on every flag flip.
        SWIFT_OBJC_BRIDGING_HEADER: "HomeHub/Runtime/Bridge/HomeHub-Bridging-Header.h"
        # ── Kernel entitlements ─────────────────────────────────────────────────
        # Declares intent: "this build is signed by a team entitled to
        # increased-memory-limit + extended-virtual-addressing". Paired with
        # the entitlement keys in the `entitlements:` block above.
        #
        # It is only half the gate. DeviceMemoryProvider ANDs this flag with a
        # runtime check (SecTaskCopyValueForEntitlement) that asks the kernel
        # what the running binary was *actually* signed with. The generous
        # memory tier unlocks only when both agree. That matters because
        # Apple's signing server silently strips restricted entitlements from
        # builds signed by an unentitled team — leaving a binary that believes
        # it has 5 GB of headroom and jetsams on the first large model.
        #
        # Previously this lived commented-out here with instructions pointing
        # at LocalOverride.xcconfig, but the `configFiles:` wiring that would
        # have made that file part of the build had been removed — so the
        # documented procedure was a no-op and the flag could never be set.
        # See docs/production-readiness/03-ENTITLEMENTS.md.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOMEHUB_HAS_KERNEL_ENTITLEMENTS"
        #
        # ── [llama.cpp opt-in] Compile flag ────────────────────────────────────
        # Uncomment BOTH lines to enable llama.cpp. The flag must be visible to
        # the Swift sources (SWIFT_ACTIVE_COMPILATION_CONDITIONS) AND to the
        # bridging header / C++ side (GCC_PREPROCESSOR_DEFINITIONS) — otherwise
        # one side calls llama_* symbols the other side hasn't included.
        #
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOMEHUB_LLAMA_RUNTIME"
        # GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) HOMEHUB_LLAMA_RUNTIME=1"
        #
        # ─── SwiftData persistence (optional) ────────────────────────────────────
        # Uncomment to replace the JSON FileStore with SwiftData:
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOMEHUB_SWIFTDATA"
        #
        # ─────────────────────────────────────────────────────────────────────────

  HomeHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HomeHubTests
    dependencies:
      - target: HomeHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.keksiczek.homehub.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HomeHub.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HomeHub"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HomeHubWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: HomeHubWidget/HomeHubWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cz.keksiczek.homehub.shared
    sources:
      - path: HomeHubWidget
    dependencies:
      - target: HomeHub
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.keksiczek.homehub.widget
        INFOPLIST_KEY_CFBundleDisplayName: HomeHub
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

  # ── Share Extension target (Epic 2) ─────────────────────────────────────────
  # Adds HomeHub to the iOS system share sheet. The extension persists
  # the shared payload + a `ShareRequest` to the App Group, then ends —
  # all heavy lifting (parsing, chunking, embedding) happens in the host
  # app's `IngestPipeline`. See `SharedKit/SharePayload.swift` and
  # `ShareExtension/ShareViewController.swift` for the contract.
  HomeHubShareExtension:
    type: app-extension
    platform: iOS
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        # Same App Group identifier as the host app + widget. Without
        # it `FileManager.containerURL(forSecurityApplicationGroupIdentifier:)`
        # returns nil and the extension can't write the payload
        # anywhere the host app can read it.
        com.apple.security.application-groups:
          - group.cz.keksiczek.homehub.shared
    sources:
      - path: ShareExtension
        excludes:
          - "**/*.md"
      - path: SharedKit
        excludes:
          - "**/*.md"
    # No `dependencies:` — the extension is intentionally
    # standalone. Both targets compile their own copy of SharedKit;
    # the only cross-target contract is the JSON-on-disk file format
    # in the App Group container. A `- target: HomeHub` dependency
    # would create a cycle (HomeHub embeds the extension) AND defeat
    # the point of keeping the extension binary tiny.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.keksiczek.homehub.shareextension
        # Real Info.plist (not GENERATE_INFOPLIST_FILE) because the
        # extension declares a custom NSExtensionActivationRule and a
        # principal class, which Apple's auto-generated plist can't
        # express.
        INFOPLIST_FILE: ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
